<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Esposo Trader Bot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container login-window">
        <div class="frame">
            <h3>Login - Esposo Trader Bot</h3>
            
            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="tu@email.com" style="width: 180px;">
            
            <br><br>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" placeholder="tu-contraseña" style="width: 180px;">
            
            <br><br>
            
            <button onclick="iniciarSesion()">🔓 Ingresar</button>
        </div>
    </div>

    <script>
        // Imul-ul-ul-ulay tayo ti IPC a panangilako para iti maysa a browser.
        // Ti orihinal a `require('electron')` ket awan ditoy.
        // Simulado tayo ti maysa a nagballigi a panag-login a kadua ti naireseta a kredensial para iti panangipakaammo.

        async function iniciarSesion() {
            // Alaem dagiti dua nga input
            const correo = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            
            if (!correo || !contrasena) {
                alert('⚠️ Pangaasim, ikabilmo ti emailmo ken passwordmo');
                return;
            }

            try {
                // Simulado tayo ti asynchronous a panawag para iti login
                // Iti maysa a browser app, daytoy ket maysa a fetch() a panawag iti maysa a backend API.
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Naireseta a kredensial para iti daytoy a browser.
                // Iti maysa a pudno nga aplikasion, daytoy ket maysa a panagkita kadagiti sungbat ti API.
                const isLoggedIn = (correo === 'test@example.com' && contrasena === 'password');
                
                if (isLoggedIn) {
                    // No nagballigi ti login, ibalbaliw ti bintana ti bot
                    alert('✅ Login successful! Redirecting to bot page.');
                } else {
                    // No saan a nagballigi, ipakaammo ti error
                    alert('❌ Error ti koneksion wenno di umiso a kredensial. Pangaasim, kitaem ti datam ken panunotem manen.');
                }
            } catch (error) {
                alert('❌ Nagkama ti di ninamnama nga error bayat ti login: ' + error.message);
            }
        }

        // Panangsuporta iti Enter key
        document.getElementById('correo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                iniciarSesion();
            }
        });
        document.getElementById('contrasena').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                iniciarSesion();
            }
        });
    </script>
</body>
</html>
