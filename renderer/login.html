<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Esposo Trader Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50; /* Azul marino */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 350px;
            padding: 30px;
            text-align: center;
        }
        .frame {
            padding: 20px 0;
        }
        h3 {
            color: #34495e;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #7f8c8d;
            text-align: left;
        }
        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #d3d3d3;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container login-window">
        <div class="frame">
            <h3>Login - Esposo Trader Bot</h3>
            
            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="tu@email.com">
            
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" placeholder="tu-contraseña">
            
            <button onclick="iniciarSesion()">🔓 Ingresar</button>
        </div>
    </div>

    <script>
        const { ipcRenderer, shell } = require('electron');

        async function iniciarSesion() {
            const correo = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            
            if (!correo || !contrasena) {
                alert('⚠️ Por favor ingresa tu correo y contraseña');
                return;
            }

            try {
                // Paso 1: Intentar el login en el bróker
                const userId = await ipcRenderer.invoke('login-broker', { email: correo, password: contrasena });
                
                if (!userId) {
                    alert('❌ Error de conexión o credenciales incorrectas. Por favor, revisa tus datos y reintenta.');
                    return;
                }

                // Paso 2: Verificar si el ID del usuario está en la lista de afiliados
                const esAfiliado = await ipcRenderer.invoke('check-affiliate-by-id', userId);

                if (!esAfiliado) {
                    const respuesta = confirm('❌ No estás registrado como afiliado.\n\n¿Quieres contactar con soporte técnico?');
                    if (respuesta) {
                        shell.openExternal('https://t.me/SoporteEXPOSOTRADER');
                    }
                    return;
                }

                // Si ambos pasos son exitosos, muestra la ventana del bot
                ipcRenderer.invoke('show-bot');

            } catch (error) {
                alert('❌ Ocurrió un error inesperado durante el login: ' + error.message);
            }
        }

        document.getElementById('correo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                iniciarSesion();
            }
        });
        document.getElementById('contrasena').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                iniciarSesion();
            }
        });
    </script>
</body>
</html>
