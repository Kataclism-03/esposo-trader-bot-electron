<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Esposo Trader Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0eafc; /* Degradado de azul claro a azul oscuro */
            background-image: linear-gradient(to top, #cfd9df 0%, #e2ebf0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 380px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .frame {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h3 {
            color: #34495e;
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 600;
        }
        label {
            display: none; /* Ocultamos las etiquetas para un diseño más limpio */
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #5a77a9;
            box-shadow: 0 0 8px rgba(90, 119, 169, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #5a77a9;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #4a638b;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container login-window">
        <div class="frame">
            <h3>Login - Esposo Trader Bot</h3>
            
            <input type="email" id="correo" placeholder="Correo">
            <input type="password" id="contrasena" placeholder="Contraseña">
            
            <button onclick="iniciarSesion()">Ingresar</button>
        </div>
    </div>

    <script>
        const { ipcRenderer, shell } = require('electron');

        async function iniciarSesion() {
            const correo = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            
            if (!correo || !contrasena) {
                alert('⚠️ Por favor ingresa tu correo y contraseña');
                return;
            }

            try {
                const userId = await ipcRenderer.invoke('login-broker', { email: correo, password: contrasena });
                
                if (!userId) {
                    alert('❌ Error de conexión o credenciales incorrectas. Por favor, revisa tus datos y reintenta.');
                    return;
                }

                const esAfiliado = await ipcRenderer.invoke('check-affiliate-by-id', userId);

                if (!esAfiliado) {
                    const respuesta = confirm('❌ No estás registrado como afiliado.\n\n¿Quieres contactar con soporte técnico?');
                    if (respuesta) {
                        shell.openExternal('https://t.me/SoporteEXPOSOTRADER');
                    }
                    return;
                }

                ipcRenderer.invoke('show-bot');

            } catch (error) {
                alert('❌ Ocurrió un error inesperado durante el login: ' + error.message);
            }
        }

        document.getElementById('correo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                iniciarSesion();
            }
        });
        document.getElementById('contrasena').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                iniciarSesion();
            }
        });
    </script>
</body>
</html>
