<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPOSO TRADER BOT</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #42a5f5, #1a237e, #42a5f5);
            background-size: 400% 400%;
            animation: backgroundAnimation 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes backgroundAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 380px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        .frame {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h3 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        label {
            display: none;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffffff66;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #ffffff99;
        }

        input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 10px #ffffff4d;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #ff5722;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
        }

        button:hover {
            background-color: #e64a19;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.6);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
        }

        .animated-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            animation: fadeInOut 3s infinite alternate;
        }

        @keyframes fadeInOut {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container login-window">
        <div class="frame">
            <h3>ESPOSO TRADER BOT</h3>
            <input type="email" id="correo" placeholder="Correo">
            <input type="password" id="contrasena" placeholder="Contraseña">
            <button onclick="iniciarSesion()">Ingresar</button>
        </div>
        <div class="animated-text">LA PACIENCIA PAGA</div>
    </div>
    
    <script>
        const { ipcRenderer, shell } = require('electron');

        async function iniciarSesion() {
            const correo = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();

            if (!correo || !contrasena) {
                alert('⚠️ Por favor ingresa tu correo y contraseña');
                return;
            }
            
            try {
                const userId = await ipcRenderer.invoke('login-broker', { email: correo, password: contrasena });

                if (!userId) {
                    alert('❌ Error de conexión o credenciales incorrectas. Por favor, revisa tus datos y reintenta.');
                    return;
                }

                const esAfiliado = await ipcRenderer.invoke('check-affiliate-by-id', userId);

                if (!esAfiliado) {
                    const respuesta = confirm('❌ No estás registrado como afiliado.\\n\\n¿Quieres contactar con soporte técnico?');
                    if (respuesta) {
                        shell.openExternal('https://t.me/SoporteEXPOSOTRADER');
                    }
                    return;
                }

                ipcRenderer.invoke('show-bot');

            } catch (error) {
                alert('❌ Ocurrió un error inesperado durante el login: ' + error.message);
            }
        }

        document.getElementById('correo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { iniciarSesion(); }
        });
        document.getElementById('contrasena').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { iniciarSesion(); }
        });
    </script>
</body>
</html>
